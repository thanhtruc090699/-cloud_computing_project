<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Public-Notes-Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='home.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Nunito&display=swap" rel="stylesheet">

</head>
<body>
    
    <div class="home-container">
        <div class="home-header">
            <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo">
        </div>
        <form action="/view" method="POST">
            <input type="text" name="query" placeholder="Email or #Tags(e.g #random, #today,...)" class="home-input">
            <button  class="view-btn" type="submit">View Notes</button>
        </form>
        {% if notes %}
            <h5 class="mt-4"><strong>Notes by</strong> {{email}}</h5>
            <div class="note-grid mt-3">
                {% for note in notes %}
                <div class="note-card">
                    <p class="note-text">{{note.notes}}</li><br>
                </div>
                {% endfor %}
            </div>
        {% elif notes is defined %}
            <div class="text-center">
            <img src="{{ url_for('static', filename='img/Diary.png') }}" alt="diary">
            No Notes Found.
            </div>
        {% elif message %}
            <p class="text-danger">{{message}}</p>
        {% endif %}
        <a href="{{ url_for('create_note_page')}}" class="add-btn">
            <img src="{{ url_for('static', filename='img/plus.png') }}" alt="Logo">
            Add New Notes
        </a>
    </div>
   
   
</body>
</html>
