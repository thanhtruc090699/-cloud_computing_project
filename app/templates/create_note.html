<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='create_note.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Nunito&display=swap" rel="stylesheet">
    <title>Public-Notes-Platform</title>
</head>
<body>
    <div class="create-note-container">
        <div class="create-note-header">
            <img src="{{ url_for('static', filename='img/logo2.png') }}" alt="Logo">
        </div>
        <form action="/create_note" method="POST">
            <textarea type="text" name="notes" placeholder="Make your note here" class="text-input"></textarea><br>
            <input type="text" name="email" placeholder="Email" class="email-input"><br>
            <input type="text" name="tag" placeholder="Tags" class="tag-input"><br>
            <button type="submit" class="add-btn">
                <img src="{{ url_for('static', filename='img/plus.png') }}" alt="Logo">
                Add New Note
            </button>
        </form>
        {% if note %}
            <h5><strong>Note by</strong> {{ note.email}} </h5>
            <p><strong>Note: </strong>{{ note.notes }}</p>
            <p><strong>Tags: </strong>{{ note.tag }}</p>
            <p><strong>Created: </strong>{{ note.created_date }}</p>
        {% elif message %}
            <p>"{{ message }}"</p>
        {% endif %}
    </div>
</body>
</html>
